<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="100%" height="100%" role="img" aria-labelledby="t d" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title id="t">VodaBi system architecture (simplified)</title>
  <desc id="d">The browser streams call audio directly to OpenAI Realtime over WebRTC using an ephemeral token from the NestJS backend. Finished turns are saved, then GPT-4o scores the call against the rubric and a second call writes coaching from the fixed scores. Reports feed staff growth and manager dashboards.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#788290"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b87d"/></marker>
  </defs>

  <rect width="1000" height="940" rx="24" fill="#101319"/>

  <text x="40" y="58" font-size="20" font-weight="700" letter-spacing="3" fill="#e2b87d">VODABI · ARCHITECTURE</text>
  <text x="40" y="90" font-size="18" fill="#a3acb9">Simplified view. No client data, prompts or rubric content.</text>

  <!-- Row 1: browser and realtime model -->
  <rect x="40" y="130" width="400" height="130" rx="16" fill="#1a1e26" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <text x="68" y="182" font-size="28" font-weight="700" fill="#faf9f6">Browser</text>
  <text x="68" y="218" font-size="19" fill="#a3acb9">React 19 · staff or candidate</text>

  <rect x="560" y="130" width="400" height="130" rx="16" fill="#1a1e26" stroke="#e2b87d" stroke-opacity="0.6" stroke-width="2"/>
  <text x="588" y="182" font-size="28" font-weight="700" fill="#faf9f6">OpenAI Realtime</text>
  <text x="588" y="218" font-size="19" fill="#a3acb9">AI customer persona</text>

  <line x1="448" y1="195" x2="552" y2="195" stroke="#e2b87d" stroke-width="3" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="500" y="178" font-size="17" font-weight="700" fill="#e2b87d" text-anchor="middle">WebRTC</text>
  <text x="500" y="226" font-size="15" fill="#e2b87d" text-anchor="middle">direct audio</text>

  <!-- Browser <-> backend -->
  <line x1="110" y1="332" x2="110" y2="268" stroke="#788290" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="124" y="294" font-size="16" fill="#a3acb9">ephemeral token</text>
  <line x1="390" y1="268" x2="390" y2="332" stroke="#788290" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="376" y="320" font-size="16" fill="#a3acb9" text-anchor="end">finished turns</text>

  <!-- Row 2: backend and database -->
  <rect x="40" y="340" width="400" height="130" rx="16" fill="#1a1e26" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <text x="68" y="392" font-size="28" font-weight="700" fill="#faf9f6">NestJS 11 API</text>
  <text x="68" y="428" font-size="19" fill="#a3acb9">Sign-in, magic links, roles</text>

  <rect x="560" y="340" width="400" height="130" rx="16" fill="#1a1e26" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <text x="588" y="392" font-size="28" font-weight="700" fill="#faf9f6">MariaDB · Prisma 7</text>
  <text x="588" y="428" font-size="19" fill="#a3acb9">Personal data encrypted at rest</text>

  <line x1="448" y1="405" x2="552" y2="405" stroke="#788290" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Row 3: two-step evaluation -->
  <line x1="240" y1="478" x2="240" y2="552" stroke="#788290" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="254" y="522" font-size="16" fill="#a3acb9">call ends</text>

  <rect x="40" y="560" width="400" height="150" rx="16" fill="#1a1e26" stroke="#e2b87d" stroke-opacity="0.6" stroke-width="2"/>
  <text x="68" y="610" font-size="17" font-weight="700" letter-spacing="2" fill="#e2b87d">STEP 1 · SCORE</text>
  <text x="68" y="648" font-size="24" font-weight="700" fill="#faf9f6">GPT-4o, strict JSON</text>
  <text x="68" y="682" font-size="19" fill="#a3acb9">One result per rubric item</text>

  <rect x="560" y="560" width="400" height="150" rx="16" fill="#1a1e26" stroke="#e2b87d" stroke-opacity="0.6" stroke-width="2"/>
  <text x="588" y="610" font-size="17" font-weight="700" letter-spacing="2" fill="#e2b87d">STEP 2 · COACH</text>
  <text x="588" y="648" font-size="24" font-weight="700" fill="#faf9f6">GPT-4o feedback</text>
  <text x="588" y="682" font-size="19" fill="#a3acb9">Written from the fixed scores</text>

  <line x1="448" y1="635" x2="552" y2="635" stroke="#e2b87d" stroke-width="3" marker-end="url(#g)"/>
  <text x="500" y="620" font-size="15" fill="#e2b87d" text-anchor="middle">scores</text>

  <!-- Row 4: reports -->
  <line x1="760" y1="718" x2="760" y2="782" stroke="#788290" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="40" y="790" width="920" height="110" rx="16" fill="#1a1e26" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <text x="68" y="838" font-size="26" font-weight="700" fill="#faf9f6">Reports</text>
  <text x="68" y="872" font-size="19" fill="#a3acb9">Staff growth and badges · manager team dashboard</text>
</svg>
