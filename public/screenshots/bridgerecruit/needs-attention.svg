<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Yellow Demo Banner -->
  <rect x="24" y="16" width="1152" height="42" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1" />
  <text x="44" y="42" font-size="13" font-weight="500" fill="#92400e">Read-only demo — seeded data, writes disabled.</text>
  <text x="1054" y="42" font-size="13" font-weight="600" fill="#92400e" text-decoration="underline">Request live access</text>

  <!-- Navigation Bar -->
  <g transform="translate(24, 72)">
    <rect x="0" y="0" width="1152" height="56" rx="16" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
    <circle cx="34" cy="28" r="4" fill="#4f46e5" />
    <text x="46" y="33" font-size="15" font-weight="700" fill="#0f172a">BridgeRecruit</text>
    <text x="160" y="32" font-size="13" font-weight="500" fill="#64748b">Institutions</text>
    <text x="250" y="32" font-size="13" font-weight="500" fill="#64748b">Pipeline</text>
    <text x="330" y="32" font-size="13" font-weight="500" fill="#64748b">Calendar</text>
    <!-- Active Tab: Needs Attention -->
    <rect x="404" y="12" width="134" height="32" rx="16" fill="#4338ca" />
    <text x="424" y="32" font-size="13" font-weight="600" fill="#ffffff">Needs Attention</text>
    <text x="564" y="32" font-size="13" font-weight="500" fill="#64748b">Reports</text>
    <text x="638" y="32" font-size="13" font-weight="500" fill="#64748b">Settings</text>
  </g>

  <!-- Needs Attention Content -->
  <g transform="translate(24, 156)">
    <text x="0" y="32" font-size="28" font-weight="800" fill="#0f172a">Needs Attention</text>
    <text x="0" y="60" font-size="13.5" font-weight="400" fill="#475569">Institutions with no touchpoint in the last 30 days (stalled/cold). Draft a low-pressure re-engagement email per institution — review before sending, this only drafts.</text>

    <!-- Card 1: Kuala Lumpur STEM Academy -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="700" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="38" font-size="15" font-weight="700" fill="#0f172a">Kuala Lumpur STEM Academy</text>
      <text x="20" y="62" font-size="12.5" fill="#64748b">Kuala Lumpur, Malaysia · tier 3 standard · <tspan fill="#b91c1c" font-weight="600">50 days inactive</tspan></text>

      <!-- Draft Re-engagement Button -->
      <rect x="520" y="28" width="160" height="36" rx="8" fill="#4338ca" />
      <text x="538" y="51" font-size="12.5" font-weight="600" fill="#ffffff">Draft Re-engagement</text>
    </g>

    <!-- Card 2: Manila Heritage School -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="700" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="38" font-size="15" font-weight="700" fill="#0f172a">Manila Heritage School</text>
      <text x="20" y="62" font-size="12.5" fill="#64748b">Manila, Philippines · tier 3 standard · <tspan fill="#b91c1c" font-weight="600">45 days inactive</tspan></text>

      <!-- Draft Re-engagement Button -->
      <rect x="520" y="28" width="160" height="36" rx="8" fill="#4338ca" />
      <text x="538" y="51" font-size="12.5" font-weight="600" fill="#ffffff">Draft Re-engagement</text>
    </g>
  </g>
</svg>
