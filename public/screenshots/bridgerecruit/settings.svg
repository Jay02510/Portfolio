<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Yellow Demo Banner -->
  <rect x="24" y="16" width="1152" height="42" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1" />
  <text x="44" y="42" font-size="13" font-weight="500" fill="#92400e">Read-only demo — seeded data, writes disabled.</text>
  <text x="1054" y="42" font-size="13" font-weight="600" fill="#92400e" text-decoration="underline">Request live access</text>

  <!-- Navigation Bar -->
  <g transform="translate(24, 72)">
    <rect x="0" y="0" width="1152" height="56" rx="16" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
    <circle cx="34" cy="28" r="4" fill="#4f46e5" />
    <text x="46" y="33" font-size="15" font-weight="700" fill="#0f172a">BridgeRecruit</text>
    <text x="160" y="32" font-size="13" font-weight="500" fill="#64748b">Institutions</text>
    <text x="250" y="32" font-size="13" font-weight="500" fill="#64748b">Pipeline</text>
    <text x="330" y="32" font-size="13" font-weight="500" fill="#64748b">Calendar</text>
    <text x="414" y="32" font-size="13" font-weight="500" fill="#64748b">Needs Attention</text>
    <text x="544" y="32" font-size="13" font-weight="500" fill="#64748b">Reports</text>
    <!-- Active Tab: Settings -->
    <rect x="608" y="12" width="82" height="32" rx="16" fill="#4338ca" />
    <text x="626" y="32" font-size="13" font-weight="600" fill="#ffffff">Settings</text>
  </g>

  <!-- Settings Content -->
  <g transform="translate(24, 156)">
    <text x="0" y="32" font-size="28" font-weight="800" fill="#0f172a">Settings</text>
    <text x="0" y="60" font-size="13.5" font-weight="400" fill="#475569">Account and Microsoft access — nothing here affects your data, only what BridgeRecruit is allowed to read or sync on your behalf.</text>

    <!-- Card 1: Signed in as -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="620" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="38" font-size="13.5" font-weight="500" fill="#64748b">Signed in as</text>
    </g>

    <!-- Card 2: Microsoft Graph access -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="620" height="86" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="34" font-size="14" font-weight="700" fill="#0f172a">Microsoft Graph access</text>
      <!-- Granted Badge -->
      <rect x="532" y="18" width="68" height="24" rx="12" fill="#dcfce7" />
      <text x="546" y="34" font-size="11.5" font-weight="600" fill="#15803d">Granted</text>

      <text x="20" y="60" font-size="12.5" fill="#475569">Required — lets BridgeRecruit read your basic profile to keep your account working.</text>
    </g>

    <!-- Card 3: Calendar sync -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="620" height="86" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="34" font-size="14" font-weight="700" fill="#0f172a">Calendar sync</text>
      <text x="532" y="34" font-size="12" fill="#64748b">Checking...</text>

      <text x="20" y="60" font-size="12.5" fill="#475569">Optional — only needed for the Calendar tab, lets follow-ups sync to your real Outlook calendar.</text>
    </g>
  </g>
</svg>
